name: Final MVP readiness

on:
  push:
    branches:
      - agent/final-mvp-readiness
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/ui/pages/discover_page.dart lib/ui/widgets/station_card.dart lib/ui/widgets/player_bar.dart test/widget_test.dart
      - name: Commit formatter output
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/pages/discover_page.dart lib/ui/widgets/station_card.dart lib/ui/widgets/player_bar.dart test/widget_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "Format release readiness changes"
            git push
          fi
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - name: Run focused release widget tests
        run: flutter test test/widget_test.dart
      - name: Run complete deterministic suite
        run: flutter test test/bookmark_model_test.dart test/bookmark_service_test.dart test/radio_browser_service_test.dart test/recent_stations_service_test.dart test/station_model_test.dart test/widget_test.dart test/directory_controller_test.dart test/audio_player_service_test.dart
      - name: Validate release metadata and repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          test "$(grep '^version:' pubspec.yaml)" = "version: 0.1.0+1"

          if git ls-files | grep -E '(^|/)(build|dist)/'; then
            echo "Tracked build or distribution output found."
            exit 1
          fi

          if git ls-files '*.rs' | grep -q .; then
            echo "Rust source remains tracked."
            exit 1
          fi

          if git grep -n -E 'smtc_windows|flutter_rust_bridge' -- lib pubspec.yaml pubspec.lock windows; then
            echo "Removed Windows media-control dependencies remain in production files."
            exit 1
          fi

          if git grep -n -E 'firebase_analytics|appcenter|sentry|telemetry' -- lib pubspec.yaml pubspec.lock; then
            echo "Analytics or telemetry implementation found."
            exit 1
          fi

          if git grep -n '/json/url/' -- lib; then
            echo "Radio Browser click notification call found."
            exit 1
          fi

          git diff --check

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows
      - name: Package Windows candidate
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OpenStation-v0.1.0-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenStation-v0.1.0-Windows
          path: OpenStation-v0.1.0-Windows.zip
          if-no-files-found: error
