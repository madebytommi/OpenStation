name: Agent audio validation

on:
  push:
    branches:
      - agent/fix-audio-connection-state
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/services/audio_player_service.dart test/audio_player_service_test.dart
      - name: Commit formatter output
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/audio_player_service.dart test/audio_player_service_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "Format audio lifecycle fix"
            git push
          fi
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test test/audio_player_service_test.dart
      - run: flutter test test/bookmark_service_test.dart test/radio_browser_service_test.dart test/recent_stations_service_test.dart test/station_model_test.dart test/widget_test.dart test/directory_controller_test.dart test/audio_player_service_test.dart

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows
