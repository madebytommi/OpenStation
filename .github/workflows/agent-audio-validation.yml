name: Agent audio validation

on:
  push:
    branches:
      - agent/fix-audio-connection-state
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test test/audio_player_service_test.dart
      - run: flutter test test/bookmark_service_test.dart test/radio_browser_service_test.dart test/recent_stations_service_test.dart test/station_model_test.dart test/widget_test.dart test/directory_controller_test.dart test/audio_player_service_test.dart

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows
